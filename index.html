<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOKA — Hybrid Task Scheduling</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }
    h1 { margin-bottom: 0.25em; }
    p  { margin-top: 0; color: #555; }
    .cards {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 1rem;
      padding: 2rem 3rem;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .card .emoji { font-size: 4rem; }
    .card .label { font-size: 1.1rem; font-weight: 600; margin-top: 0.5rem; }
    .card .sub   { font-size: 0.85rem; color: #777; }
  </style>
</head>
<body>
  <h1>Hybrid Task Scheduling</h1>
  <p>Pilih algoritma untuk dijelajahi:</p>

  <div class="cards">
    <a class="card" href="hlwoa/index.html">
      <div class="emoji">🐋</div>
      <div class="label">HLWOA</div>
      <div class="sub">HEFT + Whale Optimization + Lévy Flight</div>
    </a>
    <a class="card" href="hc-cso/index.html">
      <div class="emoji">🐱</div>
      <div class="label">HC-CSO</div>

    </a>
  </div>
